<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubsTracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold fs-4">
      <i class="bi bi-collection-play me-2"></i>SubsTracker
    </span>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-light btn-sm" id="navDashboard">
        <i class="bi bi-speedometer2 me-1"></i>ダッシュボード
      </button>
      <button class="btn btn-outline-light btn-sm" id="navList">
        <i class="bi bi-list-ul me-1"></i>一覧
      </button>
    </div>
  </div>
</nav>

<div class="container py-4">

  <!-- ── Dashboard ──────────────────────────────────────────────────── -->
  <section id="viewDashboard">
    <h2 class="mb-4 fw-bold">ダッシュボード</h2>

    <!-- Summary cards -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-4">
        <div class="card text-center shadow-sm h-100">
          <div class="card-body">
            <div class="text-muted small mb-1">契約数</div>
            <div class="fs-2 fw-bold text-primary" id="dashCount">—</div>
            <div class="text-muted small">件</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="card text-center shadow-sm h-100">
          <div class="card-body">
            <div class="text-muted small mb-1">月額換算合計</div>
            <div class="fs-2 fw-bold text-success" id="dashMonthly">—</div>
            <div class="text-muted small">円 / 月</div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card text-center shadow-sm h-100">
          <div class="card-body">
            <div class="text-muted small mb-1">年額換算合計</div>
            <div class="fs-2 fw-bold text-warning" id="dashYearly">—</div>
            <div class="text-muted small">円 / 年</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Category counts -->
    <div class="card shadow-sm mb-4">
      <div class="card-header fw-semibold">カテゴリ別件数</div>
      <div class="card-body">
        <div id="dashCategories" class="d-flex flex-wrap gap-2">—</div>
      </div>
    </div>

    <!-- Recent subscriptions -->
    <div class="card shadow-sm">
      <div class="card-header fw-semibold">最近追加したサブスクリプション</div>
      <ul class="list-group list-group-flush" id="dashRecent"></ul>
    </div>
  </section>

  <!-- ── List ───────────────────────────────────────────────────────── -->
  <section id="viewList" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold mb-0">サブスクリプション一覧</h2>
      <button class="btn btn-primary" id="btnAdd">
        <i class="bi bi-plus-lg me-1"></i>新規登録
      </button>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>サービス名</th>
              <th>カテゴリ</th>
              <th class="text-end">料金</th>
              <th>請求周期</th>
              <th class="text-center">操作</th>
            </tr>
          </thead>
          <tbody id="subsList"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ── Form (add / edit) ───────────────────────────────────────────── -->
  <section id="viewForm" class="d-none">
    <h2 class="fw-bold mb-4" id="formTitle">新規登録</h2>

    <div class="card shadow-sm">
      <div class="card-body">
        <div id="formErrors" class="alert alert-danger d-none"></div>

        <form id="subForm" novalidate>
          <input type="hidden" id="formId" />

          <div class="mb-3">
            <label for="fieldName" class="form-label fw-semibold">サービス名 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="fieldName" placeholder="例: Netflix" required />
          </div>

          <div class="mb-3">
            <label for="fieldPrice" class="form-label fw-semibold">料金 <span class="text-danger">*</span></label>
            <div class="input-group">
              <input type="number" class="form-control" id="fieldPrice" placeholder="例: 1490" min="1" required />
              <span class="input-group-text">円</span>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">請求周期 <span class="text-danger">*</span></label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="billing_cycle" id="cycleMonthly" value="MONTHLY" checked />
                <label class="form-check-label" for="cycleMonthly">月額</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="billing_cycle" id="cycleYearly" value="YEARLY" />
                <label class="form-check-label" for="cycleYearly">年額</label>
              </div>
            </div>
          </div>

          <div class="mb-4">
            <label for="fieldCategory" class="form-label fw-semibold">カテゴリ <span class="text-danger">*</span></label>
            <select class="form-select" id="fieldCategory" required>
              <option value="">選択してください</option>
              <option>動画</option>
              <option>音楽</option>
              <option>AI</option>
              <option>ゲーム</option>
              <option>仕事</option>
              <option>クラウド</option>
              <option>その他</option>
            </select>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-floppy me-1"></i>保存
            </button>
            <button type="button" class="btn btn-outline-secondary" id="btnCancel">
              <i class="bi bi-x-lg me-1"></i>キャンセル
            </button>
          </div>
        </form>
      </div>
    </div>
  </section>

</div><!-- /container -->

<!-- ── Delete confirm modal ───────────────────────────────────────────── -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title">削除の確認</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="deleteMessage" class="mb-0"></p>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button>
        <button type="button" class="btn btn-danger" id="btnConfirmDelete">削除</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
